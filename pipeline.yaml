  - id: 129
    phase: 7
    name: Sheet goods packing — replace Guillotine with MAXRECTS
    description: >
      The current Guillotine BSSF algorithm in packSheets() (src/utils/cutlist.ts)
      fragments free space into disjoint strips after each placement. For example,
      three 6×36 boards on a 24×48 sheet leaves three separate 6.5×11.5 free rects
      at the top rather than one contiguous 24×11.5 rect — so a 12×6 part that
      physically fits is incorrectly placed on a second sheet.

      Replace the guillotineSplit() function and freeRects management with the
      Maximal Rectangles algorithm (MAXRECTS-BSSF). After each placement, generate
      all maximal free rectangles that contain the remaining space (overlapping is
      allowed), then prune any rect that is fully contained within another.
      The tryPlace() scoring (BSSF) stays the same.

      Update unit tests in tests/cutlist.test.ts to cover the case described above
      (three 6×36 boards + one 12×6 on a 24×48 sheet → all four fit on one sheet).
    deps: [128]
    status: accepted
  - id: 130
    phase: 7
    name: Sheet goods packing — fix edge-fit gap causing oversized fallback
    description: >
      packSheets() adds `gap` to both piece dimensions when checking fit against a
      free rect. This means a piece that exactly fills a sheet dimension (e.g. a 48"
      piece on a 48"-tall sheet) fails the fit check (48 + 0.5 > 48) and falls
      through to the oversized fallback path, which places it unrotated and on its
      own sheet even though it physically fits.

      Two visible symptoms on a 24×48 sheet with a 48×6 part plus three 6×36 parts:
      1. The 48×6 board is placed horizontally (unrotated) instead of vertically.
      2. All four parts end up on two sheets instead of one.

      Fix: expand the initial free rect for each new sheet by gap in both dimensions:
        freeRects: [{ x: 0, y: 0, w: sheetWidth + gap, h: sheetHeight + gap }]
      This absorbs the trailing gap at the sheet boundary so pieces that exactly
      fill a dimension are not penalized. Interior gap between adjacent pieces is
      unaffected.

      Add a unit test: 48×6 part + three 6×36 parts on a 24×48 sheet → all four
      fit on one sheet, 48×6 is placed rotated (length=6, width=48 in placement).
    deps: [129]
    status: accepted
  - id: 131
    phase: 7
    name: Sheet goods packing — additional unit tests (green cases)
    description: >
      Add unit tests to tests/cutlist.test.ts covering packSheets edge cases that
      are expected to pass without any code changes. Do NOT add tests for the
      edge-fit/gap-boundary bug — those belong in task #130.

      Add all of the following in a new describe block 'packSheets — edge cases':

      5. Square part — rotation not attempted (partLength === partWidth), placement
         succeeds on one sheet, rotated === false.

      6. Part larger than sheet in both orientations — oversized fallback path is
         taken; result has 1 sheet, 1 placement, placement x === gap/2 and
         y === gap/2, rotated === false.

      8. No overlaps between placements — pack 6 varied parts onto a sheet and
         assert that no two placement rects intersect (x/y/length/width check).

      9. Sort by area descending — given a small part and a large part (small has
         smaller area), both fit on one sheet; the large part is listed first in
         placements (placed first due to sort).

      10. Gap between adjacent parts — two parts placed side by side; the right
          edge of the left part plus gap equals the left edge of the right part
          (within floating-point tolerance).

      11. Part at sheet edge — first part placed on a fresh sheet; its x and y
          coordinates equal gap/2.

      12. Exactly two full sheets — parts whose combined area exactly fills two
          sheets but cannot share; result has exactly 2 sheets.

      13. Oversized part on its own sheet, remaining parts pack together — one part
          larger than the sheet plus several normal parts; oversized is alone on
          sheet 1, normals pack onto sheet 2 (not sheet 1).

      14. wastePercent reflects actual unused area — one part covering exactly half
          the sheet area; wastePercent is approximately 0.5.

      15. wastePercent is clamped to 0 minimum — a part that fills more than the
          sheet (oversized fallback); wastePercent === 0 (Math.max(0, ...) clamp).

      If any test fails unexpectedly, do not adjust the test to pass — instead
      leave a TODO comment and skip the test with it.skip() so the suite stays
      green, and report which tests were skipped in the plan's output.
    deps: [130]
    status: accepted
