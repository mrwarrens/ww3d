  # Phase 3 tasks
  - id: 23
    phase: 3
    name: Assembly data model and grouping
    description: An Assembly is a named group with a position (a Three.js Group node). Parts belong to an assembly. Moving the assembly moves all its parts. The outliner shows assemblies with their parts nested inside. No single part is the parent — the assembly itself is the anchor.
    deps: []
    status: accepted
  - id: 28
    phase: 3
    name: Multi-select in outliner
    description: Shift+click and Cmd+click on part rows in the outliner to select multiple parts. Selection is outliner-only for now — clicking in the 3D viewport still selects a single part.
    deps: []
    status: accepted
  - id: 29
    phase: 3
    name: Assembly UI — create, assign, remove
    description: "New Assembly" button in the outliner creates an empty named assembly. Drag part rows onto an assembly row to add them. Cmd+G groups the current outliner multi-selection into a new assembly. Right-click a part row to remove it from its assembly.
    deps: [23, 28]
    status: accepted
  - id: 30
    phase: 3
    name: Assembly selection and movement
    description: Clicking an assembly row in the outliner selects the assembly — panel shows the assembly position, dragging in the 3D viewport moves the whole group. Clicking a part row selects just that part. Single-click in the 3D viewport selects the part; double-click selects the assembly the part belongs to (if any).
    deps: [29]
    status: accepted
  - id: 31
    phase: 3
    name: Update help panel with all keyboard shortcuts and click behaviors
    description: Rewrite the help panel so every shortcut and interaction is listed one rule per line. Must include all existing shortcuts (Left-drag to draw, Right-drag to orbit, Middle/Shift-drag to pan, Scroll to zoom, Delete to delete, Escape to deselect, Cmd+D to duplicate, Cmd+Z/Cmd+Shift+Z to undo/redo, Cmd+S to save, G to toggle snap, 1/2/3/4 for camera presets) plus new assembly interactions (Cmd+G to group, single-click to select part, double-click to select assembly, click assembly row in outliner to select group, click part row in outliner to select part).
    deps: [30]
    status: accepted
  - id: 25
    phase: 3
    name: Basic constraints
    description: Constraint types — flush, centered, offset by X — between pairs of parts
    deps: [30]
    status: accepted
  - id: 26
    phase: 3
    name: Constraint propagation
    description: Changing one dimension updates connected parts via constraint graph
    deps: [25]
    status: accepted
  - id: 27
    phase: 2
    name: Bug: drag-to-move does not update position inputs
    description: When a part is dragged to a new position, the Px/Py/Pz fields in the properties panel do not update to reflect the new position until the part is deselected and re-selected.
    deps: [21]
    status: accepted

  - id: 32
    phase: 3
    name: Bug: multi-select and assembly selection do not highlight 3D parts
    description: Two related bugs sharing the same root cause — selection state is a single selectedId string instead of a set. (1) Cmd/Shift+clicking multiple parts in the outliner highlights them in the list but only one (or none) is highlighted in the 3D viewport. (2) Clicking an assembly row in the outliner selects its parts in the list but none are highlighted in the 3D viewport. Fix by changing selection state from selectedId to selectedIds (a Set or array), then update Board.tsx to highlight all selected parts and Scene.tsx to handle multi-selection keyboard interactions.
    deps: [28, 23]
    status: accepted

  - id: 33
    phase: 3
    name: Arrow key increment/decrement in properties panel inputs
    description: When the cursor is inside a text input in the properties panel, Up/Down arrow keys should nudge the value. Dimension fields (L/W/T) increment/decrement by 1/16" with a minimum of 1/16" — cannot go to zero or negative. Position fields (Px/Py/Pz) increment/decrement by 1/16" with no minimum. Rotation fields (Rx/Ry/Rz) increment/decrement by 1 degree with no minimum. The store should be updated on each keypress so the 3D viewport updates live.
    deps: [21, 7]
    status: accepted
  - id: 34
    phase: 3
    name: Editable assembly name in properties panel
    description: When an assembly is selected, the properties panel should show an editable name field for the assembly (same pattern as the part name field). Committing the value updates the assembly name in the store and reflects in the parts list.
    deps: [30]
    status: accepted
  - id: 35
    phase: 3
    name: Delete key removes selected assembly and all its parts
    description: When an assembly is selected, pressing Delete/Backspace should remove the assembly and all parts that belong to it from the project store. Should be undoable via Cmd+Z.
    deps: [30]
    status: accepted
  - id: 36
    phase: 3
    name: Cmd+D duplicates selected assembly and all its parts
    description: When an assembly is selected, Cmd+D should duplicate the assembly and all its parts with a slight position offset. The new assembly becomes the active selection. Should be undoable via Cmd+Z.
    deps: [30]
    status: accepted
  - id: 37
    phase: 3
    name: Rename outliner to parts list
    description: Rename all user-facing references from "outliner" to "parts list" — UI labels, component names (PartOutliner.tsx → PartsList.tsx), CSS classes, test files, and any documentation. Pure rename, no behavior change.
    deps: []
    status: accepted
  - id: 38
    phase: 3
    name: Bug: parts list panel is not visible
    description: The parts list panel is not visible in the UI. Investigate and fix — likely a CSS issue (z-index, display, visibility, or positioning) introduced during the assembly UI or rename work.
    deps: []
    status: accepted
  - id: 39
    phase: 3
    name: Bug: position fields increment with floating point rounding error
    description: Position fields (Px/Py/Pz) are accumulating floating point error when incremented with arrow keys. Starting at 0, each 1/16" step produces 0.063, 0.126, 0.189... instead of 0.0625, 0.125, 0.1875. The cause is toFixed(3) rounding 0.0625 to 0.063, so each subsequent step compounds the error. Fix by using toFixed(4) or by displaying position values through toFractionalInches() like the dimension fields do.
    deps: [33]
    status: accepted
  - id: 40
    phase: 3
    name: Bug: duplicating an assembly also duplicates a part into the original
    description: When duplicating an assembly, one part from the original assembly is incorrectly duplicated into the original instead of only into the copy. Example — Assembly 1 contains parts A and B; after Cmd+D the result is Assembly 1 with parts A, B, A and Assembly 2 with parts A, B. The duplicate store action is likely iterating parts and accidentally appending one back to the source assembly. The original assembly should be unchanged after duplication.
    deps: [36]
    status: accepted

  - id: 41
    phase: 3
    name: Eyedropper — sample color from a part in the viewport
    description: Add an eyedropper button next to the color swatch in the properties panel. Clicking it enters eyedropper mode — the cursor changes and the next click on any part in the 3D viewport reads that part's stored hex color (via raycasting, not pixel sampling) and applies it to the currently selected part. Clicking anywhere else or pressing Escape cancels eyedropper mode.
    deps: [8]
    status: accepted
  - id: 42
    phase: 3
    name: Assembly visibility toggle in parts list
    description: Add a show/hide button to each assembly row in the parts list panel, following the same pattern as the per-part visibility toggle. Toggling an assembly's visibility shows or hides all parts belonging to it. The assembly's hidden state is stored in the project store and persists with save/load.
    deps: [29, 11]
    status: accepted

  - id: 43
    phase: 3
    name: Bug: eyedropper click selects part instead of sampling color
    description: After clicking the Pick button (cursor changes to crosshair), clicking a part in the 3D viewport selects that part instead of sampling its color. The eyedropperActive flag is not being checked before the onSelect handler fires in Board.tsx — the onEyedropperClick early-return path is not working. The click is falling through to the normal selection logic.
    deps: [41]
    status: accepted
  - id: 44
    phase: 3
    name: Display position inputs in fractional inches; normalize decimal input on blur
    description: Position fields (Px/Py/Pz) currently display raw decimal values. Update them to display in fractional inches using toFractionalInches() — the same format already used by dimension fields. On blur, both position and dimension inputs should normalize whatever the user typed (decimal like "1.5", fraction like "1-1/2", or mixed) into the canonical fractional display format (e.g. "1-1/2""). This ensures consistent display across all numeric inputs in the panel.
    deps: [21, 39]
    status: accepted
  - id: 45
    phase: 3
    name: Bug: properties panel text inputs too narrow for fractional values
    description: The numeric inputs in the properties panel are not wide enough to display longer fractional values without clipping. Example — "-22-11/16" is truncated visually. Widen all numeric inputs in the panel (dimensions, position, rotation) so that values up to at least 10 characters display without clipping.
    deps: [44]
    status: accepted
  - id: 46
    phase: 3
    name: Bug: position arrow key decrement has incorrect floor of -1-1/16"
    description: Pressing the down arrow in a position field (Px/Py/Pz) stops decrementing at -1-1/16". Position fields should have no floor — negative values of any magnitude must be allowed. The dimension minimum clamp (1/16") is incorrectly being applied to position fields. Fix the arrow key handler for position inputs to remove the clamp entirely.
    deps: [33]
    status: accepted
  - id: 47
    phase: 3
    name: Dimension inputs reformat decimal input to fractional on blur
    description: Dimension fields (L/W/T) should normalize decimal input to fractional display on blur, matching the behavior added to position fields in #44. Example — typing "1.5" and tabbing away should reformat to "1-1/2"". The existing parseInches utility already handles decimal input; the fix is to pass the parsed value through toFractionalInches() when committing on blur, rather than leaving the raw typed string in the input.
    deps: [44]
    status: accepted

  - id: 48
    phase: 3
    name: Axis lines toggle in grid controls pane
    description: Add a toggle button to the grid controls pane to show/hide X/Y/Z axis lines in the 3D viewport. Default off. When enabled, each axis renders a line extending in both the positive and negative directions from the origin. The line length scales with the current grid size (e.g. half the grid size in each direction). The positive end has an arrowhead and an axis label (X, Y, or Z). Colors follow the standard convention — X=red, Y=green, Z=blue. The toggle state lives in component state (does not need to persist with the project).
    deps: [3]
    status: accepted

  # Phase 3 audit findings
  - id: 49
    phase: 3
    name: "Bug: EdgesGeometry memory leak in Board"
    description: "The edgesGeo created via useMemo in Board.tsx (new THREE.EdgesGeometry) is never disposed on unmount or when dims change. R3F does not automatically dispose useMemo-created Three.js objects. Every board deletion or L/W/T change leaks a geometry. Fix: add useEffect(() => () => edgesGeo.dispose(), [edgesGeo]) in Board.tsx."
    deps: []
    status: accepted
  - id: 50
    phase: 3
    name: "Bug: ArrowHelper memory leak in AxisLines"
    description: "The six ArrowHelper instances created in useMemo inside AxisLines (Scene.tsx) are never disposed when the component unmounts (showAxes toggled off) or when the length dep changes. Each ArrowHelper allocates internal line and cone geometry plus two materials. Fix: add a useEffect cleanup that calls dispose() on each arrow and its internal line and cone children."
    deps: [48]
    status: accepted
  - id: 51
    phase: 3
    name: "Bug: Delete and Cmd+D only act on the first selected part when multi-selected"
    description: "Scene.tsx derives selectedId = selectedIds[0] ?? null. With multiple parts selected, pressing Delete only removes the first; Cmd+D only duplicates the first. The multi-select feature was added without updating these handlers. Fix: Delete handler should iterate all selectedIds and call removePart for each; Cmd+D should duplicate all selected parts (or just the primary — decide on behavior) and select the new copies."
    deps: [28]
    status: accepted
  - id: 52
    phase: 3
    name: "Bug: PartsList onSelectAssembly called without null guard"
    description: "In PartsList.tsx, onSelectAssembly is typed as an optional prop but is called directly as onSelectAssembly(assembly.id) without a nullish guard. TypeScript strict mode flags this; at runtime it throws if the prop is ever omitted. Fix: change to onSelectAssembly?.(assembly.id)."
    deps: []
    status: accepted
  - id: 53
    phase: 3
    name: "Bug: Shift+click range select uses array index instead of visual order"
    description: "Shift+click in PartsList computes the range as allParts.slice(lo, hi + 1) using flat array indices. The visual order of rows (assemblies with nested members, then unassigned parts) does not match the flat allParts array order, so the range-selected set may include parts that are not visually adjacent. Fix: build a flat ordered list of rendered part rows in visual order and use that array for range selection."
    deps: [28]
    status: accepted
  - id: 54
    phase: 3
    name: Split PartPanel into AssemblyPanel and PartPanel components
    description: "PartPanel.tsx is 634 lines and handles two distinct rendering modes — assembly (name + Px/Py/Pz) and part (name, L/W/T, Rx/Ry/Rz, Px/Py/Pz, color, constraints) — via an if (assembly && !part) branch. All draft state hooks for both modes co-exist in the same component scope. Split into two focused components: AssemblyPanel.tsx and PartPanel.tsx, rendered conditionally from App.tsx. Each component is smaller, easier to test, and has only the state it needs."
    deps: []
    status: accepted
  - id: 55
    phase: 3
    name: "Fix: toggleAssemblyVisibility uses redundant ternary instead of logical negation"
    description: "In projectStore.ts, toggleAssemblyVisibility uses a.visible === false ? true : false. The intent is to toggle while treating undefined as visible. Simplify to visible: a.visible !== false ? false : true, or migrate Assembly.visible to always be a boolean (never undefined) in createAssembly and normalize on load, then use !a.visible."
    deps: []
    status: accepted

  - id: 56
    phase: 3
    name: Increase camera far clip distance to 200
    description: "The Canvas camera in App.tsx is configured with far: 100. Increase to far: 200 so larger projects don't get clipped at the edges of the scene."
    deps: []
    status: accepted

  # Phase 4 tasks — Joinery (child solid operations via Manifold CSG)
  - id: 57
    phase: 4
    name: Replace Outlines with postprocessing selection highlight
    description: "Install @react-three/postprocessing. Replace {isSelected && <Outlines />} in Board.tsx with a screen-space Outline effect via EffectComposer. Collect refs from all selected board meshes and pass them to the Outline effect. The edge-based <Outlines> has known issues with complex CSG geometry and curved shapes; the postprocessing approach is topology-independent. Remove the @react-three/drei Outlines import from Board.tsx."
    deps: []
    status: accepted
  - id: 58
    phase: 4
    name: Extend Part data model for child operations
    description: "Add parentId?: string and operation?: 'add' | 'subtract' to the Part interface (default operation: 'subtract'). Update createPart to accept and default these fields. Update serializeProject/deserializeProject to handle them. Add store actions: addChildPart(parentId, partData) and removeChildPart(childId). Existing updatePart applies to children unchanged. Add a selector/helper getChildParts(partId) that returns all parts with a given parentId. Undo/redo should capture addChildPart and removeChildPart."
    deps: []
    status: accepted
  - id: 59
    phase: 4
    name: CSG rendering in Board
    description: "When a Part has children in the store, compute the Manifold boolean result using getManifold() and manifoldMeshToThreeGeometry() from src/utils/manifold.ts. Start with the base box (length × thickness × width), subtract all operation:'subtract' children, union all operation:'add' children. Child positions are in parent-local space — apply child position/rotation as a transform before the boolean op. Recompute when any child's dimensions, position, or rotation changes (useEffect deps). Render plain <boxGeometry> when the part has no children (zero Manifold overhead). Dispose old geometry after each recompute."
    deps: [57, 58]
    status: accepted
  - id: 60
    phase: 4
    name: "Modify mode: enter and exit"
    description: "Add modifyingPartId: string | null to App.tsx state (initially null). Add an 'Edit Cuts' button to PartPanel — visible only when the selected part has no parentId (top-level parts only). Clicking it sets modifyingPartId to the selected part's id. Pressing Escape or clicking the button again (now labeled 'Done') clears it. While modifyingPartId is set, pass it down to Scene.tsx and Board.tsx. All parts and assemblies whose id !== modifyingPartId render at reduced opacity (0.3) so focus is on the part being edited."
    deps: [58]
    status: accepted
  - id: 61
    phase: 4
    name: "Modify mode: draw child volumes"
    description: "While modifyingPartId is set, drag-to-create on the grid plane calls addChildPart(modifyingPartId, ...) instead of addPart. The new child part has operation:'subtract' by default. Child position is stored in parent-local space (subtract parent's world position from the drag result). Default child dimensions: 3/4\" wide × 3/8\" thick × parent width (a sensible dado starting point). The newly created child becomes the active selection (set selectedIds to the new child's id)."
    deps: [58, 60]
    status: accepted
  - id: 62
    phase: 4
    name: "Modify mode: visualize children"
    description: "While in modify mode for a parent part, render each child part as a ghost wireframe overlay on top of the CSG result — a <lineSegments> EdgesGeometry in a light color (e.g. rgba white at 50% opacity) with no fill mesh. operation:'add' children render as a semi-transparent solid (distinct tint, e.g. green at 20% opacity). Outside modify mode, children are invisible — only the CSG result is shown. The ghost wireframe is clickable (used in #63 to select the child)."
    deps: [59, 60]
    status: accepted
  - id: 63
    phase: 4
    name: "Modify mode: select and edit children"
    description: "Clicking a child ghost wireframe in modify mode sets selectedIds to that child's id. PartPanel detects the selected part has a parentId and renders a child-specific view: L/W/T inputs, Rx/Ry/Rz inputs, Px/Py/Pz inputs (in parent-local space), and an add/subtract operation toggle. Constraints section is hidden for children. All existing fractional-inch inputs, blur/Enter commit, and arrow-key increment/decrement work unchanged."
    deps: [61, 62]
    status: accepted
  - id: 64
    phase: 4
    name: "Modify mode: delete children"
    description: "While in modify mode, pressing Delete/Backspace with a child part selected calls removeChildPart(selectedId). The parent's CSG result recomputes. Selection clears. The action is captured in undo history so Cmd+Z restores the deleted child."
    deps: [63]
    status: accepted
  - id: 65
    phase: 4
    name: Undo/redo for child operations
    description: "Verify that addChildPart, removeChildPart, and updatePart (when called on a child) are all captured as snapshots in the undo history stack in projectStore.ts — the same pattern used for top-level part mutations. Write unit tests covering: undo after addChildPart restores no children; undo after removeChildPart restores the child; undo after updatePart on a child restores previous dimensions."
    deps: [61, 64]
    status: accepted
  - id: 66
    phase: 4
    name: Cuts list in modify mode
    description: "Create a CutsList component (src/components/CutsList.tsx) rendered by App.tsx only while modifyingPartId is set. It lists the active parent's children by name, one row per child. Clicking a row sets selectedIds to that child's id (same as clicking its ghost wireframe in the viewport). The selected child row is highlighted. Style consistently with PartsList. Children are not shown in PartsList outside of modify mode — only the parent row appears there, with a small indicator icon (e.g. a scissors symbol) when the part has one or more children."
    deps: [60, 61]
    status: accepted
  - id: 67
    phase: 4
    name: "Bug: selecting a child cut does not highlight it in the 3D viewport"
    description: "When a child cut is selected (via CutsList row click or clicking its ghost wireframe), the selection is not visually highlighted in the 3D viewport. The selected child's ghost wireframe should render with a distinct highlight — e.g. a brighter/thicker edge color or a different material — to confirm which cut is active. The ChildGhost component in Board.tsx needs to accept an isSelected prop and change its visual treatment accordingly."
    deps: [63, 66]
    status: accepted
  - id: 68
    phase: 4
    name: "Bug: exiting cut editing mode does not apply cuts to the part"
    description: "After drawing cut volumes in modify mode and exiting (Escape or Done button), the parent part renders as a plain unmodified box — the subtraction/addition CSG operations are not reflected. The Board CSG computation may not be triggering correctly when children exist, or the geometry is being reset on mode exit. Investigate the useEffect deps in Board.tsx that drive CSG recomputation and verify that child parts written by addChildPart are present in the store and visible to the Board's children selector when modify mode exits."
    deps: [59, 61]
    status: accepted
  - id: 69
    phase: 4
    name: Operation toggle — segmented control in PartPanel
    description: "Replace the Add/Subtract operation buttons in PartPanel (shown when a child cut is selected) with a segmented control: two buttons side by side where the active option has a filled/highlighted background and the inactive one is outlined. Style consistently with the camera preset buttons (1 Front / 2 Right / 3 Top / 4 Iso). The control reads the selected child's operation value from the store and calls updatePart to toggle it. Should only be visible when the selected part has a parentId."
    deps: [63]
    status: accepted
  - id: 71
    phase: 3
    name: "Bug: duplicate part offsets X/Z position"
    description: "When duplicating a part (Cmd+D), the duplicate should appear in the same X/Z position as the original — only offset in Y (up) so it is distinguishable but sits in place. Currently the duplicate is offset in X and Z, which moves it away from the original unexpectedly. Change duplicatePart in projectStore.ts to apply zero X/Z offset and a small Y offset (e.g. 1\") only."
    deps: [9]
    status: accepted
  - id: 72
    phase: 3
    name: "Bug: duplicate part keeps exact position"
    description: "When duplicating a part (Cmd+D), the duplicate should appear at the exact same position as the original — no X, Y, or Z offset applied. The user will move it manually afterward. Change duplicatePart and duplicateParts in projectStore.ts to copy the original part's position unchanged."
    deps: [9, 71]
    status: accepted
  - id: 73
    phase: 3
    name: Remove constraints feature
    description: "Delete the constraints system entirely. Remove: src/models/Constraint.ts, src/utils/constraints.ts, tests/constraints.test.ts. Strip addConstraint/removeConstraint actions and all constraint-related state from projectStore.ts. Remove the constraint add/remove UI section from PartPanel.tsx. Remove constraint fields (constraints: []) from Part.ts createPart and from serializeProject/deserializeProject in Project.ts. Remove the getPartFacePosition, computeConstrainedPosition, and propagateConstraints calls from movePart and updatePart store actions. Update CLAUDE.md project structure to reflect removed files."
    deps: [25, 26]
    status: accepted
